services:
  - type: web
    name: ai-doc-expiry-tracker
    env: node
    autoDeploy: true          # ← Yeh line add ki — har GitHub push pe auto deploy hoga
    buildCommand: npm install && npm run build
    startCommand: node --loader tsx/esm server.ts
    envVars:
      - key: NODE_ENV
        value: production

      # ── Yeh sab Render Dashboard → Environment mein set karo ──
      # render.yaml mein kabhi bhi real secrets mat likho (GitHub pe expose hote hain)

      - key: GEMINI_API_KEY
        sync: false           # Render Dashboard se lega — yahan value mat likho

      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASS
        sync: false

      - key: ADMIN_UID
        sync: false

      - key: VITE_ADMIN_UID
        sync: false

      # ── Additional required env vars ──────────────────────────────────────

      # Firebase Admin SDK service account (JSON string — paste the full JSON)
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # Twilio WhatsApp credentials
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false

      # Stripe credentials
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Cron secret — set this to ANY random string (e.g. openssl rand -hex 16)
      # Then set the same value as X-Cron-Secret header in cron-job.org settings
      - key: CRON_SECRET
        sync: false

      # Your deployed app URL (used in email links and CORS)
      - key: APP_URL
        value: https://ai-doc-expiry-tracker.onrender.com
